<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="880" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#888">Application chart (shipping-service)</text>
<rect x="20" y="160" width="880" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="180" font-size="12" font-weight="700" fill="#888">Helm actions on crds/</text>
<rect x="20" y="300" width="880" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="320" font-size="12" font-weight="700" fill="#888">Platform (installed by someone else)</text>
<rect x="50" y="55" width="240" height="65" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="170.0" y="85.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">crds/shippingroute.yaml</text>
<text x="170.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">plain YAML, never templated</text>
<rect x="340" y="55" width="240" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="460.0" y="85.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">templates/</text>
<text x="460.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">may contain custom resources</text>
<rect x="630" y="55" width="240" height="65" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="750.0" y="85.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping-postgres guard</text>
<text x="750.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">Capabilities.APIVersions.Has + fail</text>
<rect x="50" y="195" width="240" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="170.0" y="225.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">helm install</text>
<text x="170.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">applies the CRD, once</text>
<rect x="340" y="195" width="240" height="65" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="460.0" y="225.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">helm upgrade</text>
<text x="460.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">skips crds/ entirely</text>
<rect x="630" y="195" width="200" height="65" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="730.0" y="225.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">helm uninstall</text>
<text x="730.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">leaves the CRD and its objects</text>
<rect x="50" y="335" width="240" height="65" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="170.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CRD in the API server</text>
<text x="170.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">owned by the cluster from now on</text>
<rect x="340" y="335" width="240" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="460.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">kubectl apply -f crds/</text>
<text x="460.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">the supported way to change a CRD</text>
<rect x="630" y="335" width="240" height="65" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="750.0" y="365.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">CloudNativePG operator</text>
<text x="750.0" y="382.5" font-size="11.5" fill="#dddddd" text-anchor="middle">serves postgresql.cnpg.io/v1</text>
