<path d="M170,260 L170,335" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="196.0" y="297.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">creates</text>
<text x="196.0" y="297.5" font-size="11" fill="#b8650a" text-anchor="middle">creates</text>
<path d="M460,335 L460,260" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M855,120 L855,335" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="855.0" y="148.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">checks the API</text>
<text x="855.0" y="148.5" font-size="11" fill="#555" text-anchor="middle">checks the API</text>
</svg>