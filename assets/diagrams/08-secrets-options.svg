<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="30" width="230" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="55.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Chart-created Secret</text>
<text x="135.0" y="72.5" font-size="11.5" fill="#555555" text-anchor="middle">auth.token or auth.generate</text>
<text x="135.0" y="87.5" font-size="11.5" fill="#555555" text-anchor="middle">in the release record</text>
<rect x="20" y="120" width="230" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="135.0" y="145.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">existingSecret</text>
<text x="135.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">you create it; chart only</text>
<text x="135.0" y="177.5" font-size="11.5" fill="#555555" text-anchor="middle">references it</text>
<rect x="20" y="210" width="230" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="135.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">External Secrets Operator</text>
<text x="135.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">syncs from a vault into</text>
<text x="135.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">a Secret</text>
<rect x="20" y="300" width="230" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="135.0" y="325.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Sealed Secrets</text>
<text x="135.0" y="342.5" font-size="11.5" fill="#555555" text-anchor="middle">encrypted SealedSecret in Git,</text>
<text x="135.0" y="357.5" font-size="11.5" fill="#555555" text-anchor="middle">controller decrypts</text>
<rect x="20" y="390" width="230" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="135.0" y="415.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SOPS / helm-secrets</text>
<text x="135.0" y="432.5" font-size="11.5" fill="#555555" text-anchor="middle">encrypted values files;</text>
<text x="135.0" y="447.5" font-size="11.5" fill="#555555" text-anchor="middle">Helm 4 support unchecked</text>
<rect x="420" y="150" width="190" height="120" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="515.0" y="208.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Secret in namespace</text>
<text x="515.0" y="225.0" font-size="11.5" fill="#dddddd" text-anchor="middle">key api-token</text>
<rect x="700" y="150" width="170" height="120" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="785.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Deployment</text>
<text x="785.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">env API_TOKEN</text>
<text x="785.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">secretKeyRef</text>
<path d="M250,65 L420,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,155 L420,210" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M250,245 L420,225" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M250,335 L420,250" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M250,425 L420,265" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M610,210 L700,210" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="335" y="480" font-size="12" fill="#555555" text-anchor="middle">Solid: handled by the chart. Dashed: produced outside the chart.</text>
</svg>