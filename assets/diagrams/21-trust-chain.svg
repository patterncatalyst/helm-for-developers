<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="940" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#888">Chain 1: Helm provenance (PGP), covers the .tgz bytes</text>
<rect x="20" y="210" width="940" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="230" font-size="12" font-weight="700" fill="#888">Chain 2: cosign (key pair), covers the registry manifest digest</text>
<rect x="40" y="60" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping-service-1.0.0.tgz</text>
<text x="135.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">sha256:f8d507...</text>
<rect x="280" y="60" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="375.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">helm package --sign</text>
<text x="375.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">legacy secring.gpg</text>
<rect x="520" y="60" width="190" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="615.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">.tgz.prov</text>
<text x="615.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">Chart.yaml + files: sha256</text>
<rect x="760" y="60" width="180" height="80" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="850.0" y="98.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">helm verify / --verify</text>
<text x="850.0" y="115.0" font-size="11.5" fill="#dddddd" text-anchor="middle">pubring.kbx or .gpg</text>
<rect x="40" y="250" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">oci://127.0.0.1:5001/signed</text>
<text x="135.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">manifest sha256:...</text>
<rect x="280" y="250" width="190" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="375.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cosign sign --key</text>
<text x="375.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">cosign.key, by digest</text>
<rect x="520" y="250" width="190" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="615.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">signature artifact</text>
<text x="615.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">tag sha256-&lt;digest&gt;</text>
<rect x="760" y="250" width="180" height="80" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="850.0" y="288.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">cosign verify --key</text>
<text x="850.0" y="305.0" font-size="11.5" fill="#dddddd" text-anchor="middle">cosign.pub</text>
<path d="M230,100 L280,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,100 L520,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M710,100 L760,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230,290 L280,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M470,290 L520,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M710,290 L760,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="490" y="200" font-size="11" fill="#888" text-anchor="middle">helm push uploads the .prov as a layer of the same artifact the cosign signature then points at</text>
</svg>