# minikube: NodePorts for the tunnel script (30080 -> 8080, 30081 -> 8081).
global:
  environment: dev
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
shipping:
  service:
    type: NodePort
    nodePort: 30080
  auth:
    token: dev-token
  postgres:
    schema: shipping
notification:
  service:
    type: NodePort
    nodePort: 30081
