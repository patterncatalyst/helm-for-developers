global:
  environment: stage
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
shipping:
  replicaCount: 2
  config:
    logLevel: INFO
  # The token lives in a Secret created out of band.
  auth:
    existingSecret: shipping-api-token
notification:
  replicaCount: 2
db:
  cluster:
    instances: 2
kafka:
  replicas: 3
  replicationFactor: 3
  minInsyncReplicas: 2
  kafkaTopic:
    partitions: 3
    replicas: 3
  storage:
    type: persistent-claim
    size: 10Gi
