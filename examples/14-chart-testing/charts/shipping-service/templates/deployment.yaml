{{- $configSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shipping-service.fullname" . }}
  labels:
    {{- include "shipping-service.labels" . | nindent 4 }}
  {{- with (include "shipping-service.metadataAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shipping-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shipping-service.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ $configSum }}
        {{- with (include "shipping-service.metadataAnnotations" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k | quote }}: {{ $v | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "shipping-service.podSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ include "shipping-service.name" . }}
          image: {{ include "shipping-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "shipping-service.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "shipping-service.fullname" . }}
          env:
            {{- include "shipping-service.env" . | nindent 12 }}
          {{- include "shipping-service.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
