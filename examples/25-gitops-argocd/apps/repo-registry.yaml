# Registers the in-cluster registry addon as an OCI Helm repository for Argo CD.
# The URL has no oci:// prefix. The registry addon speaks plain HTTP, hence insecureOciForceHttp.
apiVersion: v1
kind: Secret
metadata:
  name: lab-registry
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: lab-registry
  type: helm
  url: registry.kube-system.svc.cluster.local:80/charts
  enableOCI: "true"
  insecureOciForceHttp: "true"
