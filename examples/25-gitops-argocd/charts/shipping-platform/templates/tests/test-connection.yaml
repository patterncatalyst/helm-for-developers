apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-platform-test
  labels:
    app.kubernetes.io/name: shipping-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: {{ .Values.tests.image | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      command:
        - python
        - -c
        - >-
          import urllib.request as u;
          [u.urlopen(url, timeout=10).read() for url in (
          "http://{{ include "shipping-platform.svcName" (dict "root" . "alias" "shipping") }}:{{ .Values.shipping.service.port | default 8080 }}/healthz"{{ if .Values.tags.messaging }},
          "http://{{ include "shipping-platform.svcName" (dict "root" . "alias" "notification") }}:{{ .Values.notification.service.port | default 8080 }}/healthz"{{ end }},)]
