# minikube: NodePorts published to 127.0.0.1 at profile creation (shipping 30080, notification 30081).
global:
  environment: dev
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
shipping:
  service:
    type: NodePort
    nodePort: 30080
  auth:
    token: dev-token
  postgres:
    schema: shipping
notification:
  service:
    type: NodePort
    nodePort: 30081
