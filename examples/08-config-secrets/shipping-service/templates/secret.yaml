{{- if and (not .Values.auth.existingSecret) (or .Values.auth.token .Values.auth.generate) }}
{{- $name := include "shipping-service.fullname" . -}}
{{- $token := .Values.auth.token -}}
{{- if not $token }}
{{- /* Reuse the token from the live Secret; generate one only on first install. lookup is empty under helm template and --dry-run=client. */ -}}
{{- $current := dig "data" "api-token" "" (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- if $current }}
{{- $token = $current | b64dec }}
{{- else }}
{{- $token = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "shipping-service.labels" . | nindent 4 }}
type: Opaque
data:
  api-token: {{ $token | b64enc | quote }}
{{- end }}
