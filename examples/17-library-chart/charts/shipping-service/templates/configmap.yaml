apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pc-lib.fullname" . }}
  labels:
    {{- include "pc-lib.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ include "pc-lib.fullname" . | quote }}
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  DEPLOY_ENV: {{ include "shipping-service.environment" . | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SHIPPING_DEFAULT_CARRIER: {{ .Values.config.defaultCarrier | quote }}
  SHIPPING_STORAGE: {{ .Values.config.storage | quote }}
  KAFKA_ENABLED: {{ .Values.kafka.enabled | quote }}
  KAFKA_TOPIC_DISPATCHED: {{ .Values.kafka.topic | quote }}
