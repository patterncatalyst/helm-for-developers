apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ include "notification-service.fullname" . | quote }}
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  DEPLOY_ENV: {{ include "notification-service.environment" . | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KAFKA_TOPIC_DISPATCHED: {{ .Values.kafka.topic | quote }}
  KAFKA_GROUP_ID: {{ .Values.kafka.groupId | quote }}
