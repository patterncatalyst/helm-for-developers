{{- $tokenOwn := and .Values.auth.token (not .Values.auth.existingSecret) -}}
{{- $pgOwn := and .Values.postgres.password (not .Values.postgres.existingSecret) (eq .Values.config.storage "postgres") -}}
{{- if or $tokenOwn $pgOwn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shipping-service.fullname" . }}
  labels:
    {{- include "shipping-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $tokenOwn }}
  api-token: {{ .Values.auth.token | quote }}
  {{- end }}
  {{- if $pgOwn }}
  pg-password: {{ .Values.postgres.password | quote }}
  {{- end }}
{{- end }}
