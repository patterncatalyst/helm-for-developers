<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Postgres through a subchart</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The operator creates the credentials; the parent chart only references them</text><rect x="40" y="150" width="300" height="130" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="190.0" y="174" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping-service</text><text x="190.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">parent chart</text><text x="190.0" y="210" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">dependencies: shipping-postgres</text><rect x="40" y="360" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="190.0" y="384" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping-postgres</text><text x="190.0" y="404" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">subchart in charts/</text><text x="190.0" y="420" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">renders one Cluster</text><line x1="190" y1="360" x2="190" y2="280" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="190.0" y="306.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">import-values</text><rect x="480" y="130" width="300" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="630.0" y="154" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Deployment</text><text x="630.0" y="174" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">PG_HOST = shipping-postgres-rw</text><text x="630.0" y="190" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">PG_PASSWORD from secretKeyRef</text><rect x="480" y="360" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="630.0" y="384" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Cluster (CNPG)</text><text x="630.0" y="404" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">postgresql.cnpg.io/v1</text><rect x="880" y="130" width="300" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="1030.0" y="154" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Secret shipping-postgres-app</text><text x="1030.0" y="174" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">dbname, username, password</text><rect x="880" y="360" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1030.0" y="384" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">CloudNativePG operator</text><text x="1030.0" y="404" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">installed once per cluster</text><line x1="340" y1="180" x2="480" y2="180" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="410.0" y="172.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">renders</text><line x1="340" y1="415" x2="480" y2="415" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="410.0" y="407.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">renders</text><line x1="880" y1="180" x2="780" y2="180" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="830.0" y="172.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">secretKeyRef</text><line x1="880" y1="415" x2="780" y2="415" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="830.0" y="407.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">reconciles</text><line x1="1030" y1="360" x2="1030" y2="230" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="1030.0" y="287.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">creates</text></svg>