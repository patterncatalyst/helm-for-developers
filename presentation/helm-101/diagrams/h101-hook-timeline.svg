<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="26.4" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Where the migration hook runs</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Placement decides whether a fresh install completes</text><text x="40" y="125" font-family="Red Hat Mono, Menlo, monospace" font-size="18" font-weight="bold" fill="#4A4A4A" text-anchor="start">A  pre-install,pre-upgrade</text><rect x="40" y="150" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="160.0" y="178.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Migration Job</text><text x="160.0" y="202.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">runs first</text><rect x="340" y="150" width="260" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="470.0" y="178.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Cluster + Secret</text><text x="470.0" y="202.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">created by the same release</text><rect x="660" y="150" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="780.0" y="178.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Deployment</text><text x="780.0" y="202.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">waits for readiness</text><line x1="280" y1="190" x2="340" y2="190" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="600" y1="190" x2="660" y2="190" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="960" y="175" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15.6" font-weight="normal" fill="#B71C1C" text-anchor="start">Job pod references a Secret that</text><text x="960" y="197" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15.6" font-weight="normal" fill="#B71C1C" text-anchor="start">does not exist yet: it never starts</text><text x="40" y="305" font-family="Red Hat Mono, Menlo, monospace" font-size="18" font-weight="bold" fill="#4A4A4A" text-anchor="start">B  post-install,post-upgrade with --wait</text><rect x="40" y="330" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="160.0" y="358.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Resources applied</text><text x="160.0" y="382.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">Cluster, Deployment</text><rect x="340" y="330" width="260" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="470.0" y="358.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Wait for ready</text><text x="470.0" y="382.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">kstatus watcher</text><rect x="660" y="330" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="780.0" y="358.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Migration Job</text><text x="780.0" y="382.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">runs after the wait</text><line x1="280" y1="370" x2="340" y2="370" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="600" y1="370" x2="660" y2="370" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="960" y="355" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15.6" font-weight="normal" fill="#B71C1C" text-anchor="start">/healthz needs the tables, so the</text><text x="960" y="377" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15.6" font-weight="normal" fill="#B71C1C" text-anchor="start">wait never ends: deadlock</text><rect x="40" y="460" width="1160" height="100" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="60" y="495" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15.6" font-weight="normal" fill="#4A4A4A" text-anchor="start">Fix used in the chart: post-install hook, readiness probe on /health (no database call)</text><text x="60" y="523" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15.6" font-weight="normal" fill="#4A4A4A" text-anchor="start">pre-install fits an external database that already exists</text></svg>