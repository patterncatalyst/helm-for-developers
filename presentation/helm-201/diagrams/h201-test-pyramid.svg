<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 510" width="1240" height="510"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/><rect x="340.0" y="60" width="360" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="520.0" y="88.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">helm test, ct install</text><text x="520.0" y="112.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">real cluster, real pods</text><rect x="220.0" y="190" width="600" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="520.0" y="218.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">kubeconform, --dry-run=server</text><text x="520.0" y="242.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">schemas and API admission</text><rect x="100.0" y="320" width="840" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="520.0" y="348.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">helm-unittest, helm lint --strict</text><text x="520.0" y="372.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">pure rendering, no cluster</text><line x1="985" y1="400" x2="985" y2="100" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="1000" y="110" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">Fewer, slower,</text><text x="1000" y="128" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">closer to prod</text><text x="1000" y="390" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">Many, fast,</text><text x="1000" y="408" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">run on every save</text><text x="520" y="470" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="18" font-weight="normal" fill="#4A4A4A" text-anchor="middle">Each layer asserts something the layer below cannot see.</text></svg>