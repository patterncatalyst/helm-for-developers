<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 550" width="1240" height="550"><defs><marker id="_arrow_data_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A1B9A"/></marker><marker id="_arrow_platform_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1240" height="550" fill="#FFFFFF"/><rect x="30" y="40" width="1180" height="350" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="50" y="70" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15" font-weight="bold" fill="#EE0000" text-anchor="start">shipping-platform: umbrella chart, release name platform</text><rect x="60" y="100" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="180.0" y="124" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping-service</text><text x="180.0" y="144" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">alias: shipping</text><text x="180.0" y="160" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">condition: shipping.enabled</text><rect x="380" y="100" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="500.0" y="124" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">notification-service</text><text x="500.0" y="144" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">alias: notification</text><text x="500.0" y="160" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">tags: [messaging]</text><rect x="60" y="250" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="180.0" y="274" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping-postgres</text><text x="180.0" y="294" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">alias: db</text><text x="180.0" y="310" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">condition: db.enabled</text><rect x="380" y="250" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="500.0" y="274" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping-kafka</text><text x="500.0" y="294" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">alias: kafka</text><text x="500.0" y="310" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">tags: [messaging]</text><line x1="180" y1="250" x2="180" y2="180" stroke="#6A1B9A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_data_1)"/><text x="190" y="220" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6A1B9A" text-anchor="start">import-values</text><line x1="500" y1="250" x2="500" y2="180" stroke="#6A1B9A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_data_1)"/><text x="510" y="220" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6A1B9A" text-anchor="start">import-values</text><line x1="400" y1="250" x2="290" y2="180" stroke="#6A1B9A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_data_1)"/><text x="660" y="120" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">global: environment, otlpEndpoint,</text><text x="660" y="142" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">imageRegistry reach every subchart.</text><text x="660" y="190" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">--set tags.messaging=false drops</text><text x="660" y="212" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">notification and kafka in one flag.</text><text x="660" y="260" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#B71C1C" text-anchor="start">import-values cannot override a key</text><text x="660" y="282" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#B71C1C" text-anchor="start">the subchart defaults in its own values.yaml.</text><rect x="60" y="450" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="180.0" y="474" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">CloudNativePG</text><text x="180.0" y="494" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">operator, cnpg-system</text><rect x="380" y="450" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="500.0" y="474" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Strimzi</text><text x="500.0" y="494" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">operator, strimzi</text><line x1="180" y1="450" x2="180" y2="330" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><line x1="500" y1="450" x2="500" y2="330" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><text x="190" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#006E6E" text-anchor="start">runs the Cluster CR</text><text x="510" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#006E6E" text-anchor="start">runs the Kafka CR</text><text x="660" y="480" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">The chart declares the custom resources;</text><text x="660" y="502" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">operators installed once per cluster run them.</text></svg>