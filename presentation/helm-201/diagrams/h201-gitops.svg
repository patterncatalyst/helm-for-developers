A4A4A" text-anchor="start">helm.sh/hook-weight maps to argocd.argoproj.io/sync-wave; --wait has no counterpart.</text><text x="60" y="460" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">Drift is reconciled continuously instead of at the next upgrade.</text></svg>