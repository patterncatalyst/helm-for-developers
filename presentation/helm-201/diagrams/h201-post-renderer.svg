<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530" width="1240" height="530"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker><marker id="_arrow_platform_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1240" height="530" fill="#FFFFFF"/><rect x="30" y="190" width="210" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="135.0" y="218.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">helm template</text><text x="135.0" y="242.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">or install, upgrade</text><text x="135.0" y="262.0" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">--post-renderer NAME</text><rect x="320" y="190" width="210" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="425.0" y="218.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Rendered YAML</text><text x="425.0" y="242.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">all manifests, one stream</text><rect x="610" y="160" width="300" height="160" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="760.0" y="188.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Plugin: postrenderer/v1</text><text x="760.0" y="212.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">reads stdin</text><text x="760.0" y="232.0" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">kustomize edit, patches, labels</text><text x="760.0" y="251.20000000000002" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">writes stdout</text><rect x="990" y="190" width="210" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="1095.0" y="218.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Modified YAML</text><text x="1095.0" y="242.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">labels, annotations added</text><line x1="240" y1="240" x2="320" y2="240" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="530" y1="240" x2="610" y2="240" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="570.0" y="230.0" font-family="Red Hat Text, Arial, sans-serif" font-size="13.2" fill="#5A5A5A" text-anchor="middle">stdin</text><line x1="910" y1="240" x2="990" y2="240" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="950.0" y="230.0" font-family="Red Hat Text, Arial, sans-serif" font-size="13.2" fill="#5A5A5A" text-anchor="middle">stdout</text><rect x="990" y="380" width="210" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1095.0" y="408.8" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="600" fill="#4A4A4A" text-anchor="middle">Kubernetes API</text><text x="1095.0" y="432.8" font-family="Red Hat Text, Arial, sans-serif" font-size="14.4" fill="#5A5A5A" text-anchor="middle">server-side apply</text><line x1="1095" y1="290" x2="1095" y2="380" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><rect x="30" y="380" width="900" height="130" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="50" y="412" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">Helm 4: post-renderers are plugins only; a bare executable path is rejected.</text><text x="50" y="438" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">Extra arguments go through --post-renderer-args.</text><text x="50" y="464" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16.8" font-weight="normal" fill="#4A4A4A" text-anchor="start">The chart stays untouched: use it for a change you do not own the templates for.</text></svg>