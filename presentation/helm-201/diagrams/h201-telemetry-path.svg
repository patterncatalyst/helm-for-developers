marker-end="url(#_arrow_neutral_0)"/><line x1="560" y1="195" x2="660" y2="185" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="560" y1="215" x2="660" y2="285" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="860" y1="85" x2="960" y2="175" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="860" y1="185" x2="960" y2="185" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="860" y1="285" x2="960" y2="205" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="30" y="380" width="1160" height="130" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="50" y="412" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">global.otlpEndpoint is set once on the umbrella; pc-lib.otelEnv turns it into env vars for every service.</text><text x="50" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">Empty endpoint renders OTEL_SDK_DISABLED=true, so the same chart runs without a collector.</text><text x="50" y="468" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#4A4A4A" text-anchor="start">A trace crosses Kafka: the dispatch span in shipping links to the consume span in notification.</text></svg>