apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-platform-test
  labels:
    app.kubernetes.io/name: shipping-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ .Values.tests.image | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      command:
        - sh
        - -c
        - >-
          curl -fsS --max-time 10 http://{{ include "shipping-platform.svcName" (dict "root" . "alias" "shipping") }}:{{ .Values.shipping.service.port | default 8080 }}/healthz
          && curl -fsS --max-time 10 http://{{ include "shipping-platform.svcName" (dict "root" . "alias" "notification") }}:{{ .Values.notification.service.port | default 8080 }}/healthz
